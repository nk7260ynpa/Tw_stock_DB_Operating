[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tw-stock-db-operating"
# 版本以 git tag（vX.Y.Z）為單一版本軸；發版時本欄位需與所打的 tag 對齊。
version = "2.15.0"
description = "台股資料庫操作模組，提供資料上傳、排程與 Web 管理介面"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "easydict",
    "fastapi",
    "httpx",
    "lxml",
    "mysql-connector-python",
    "pandas",
    "playwright",
    "pydantic",
    "pymysql",
    "cryptography",
    "requests",
    "schedule",
    "sqlalchemy",
    "uvicorn[standard]",
    "youtube-transcript-api",
    "yt-dlp",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools]
py-modules = ["clients", "routers", "upload", "DailyUpload", "web_server", "retry_queue"]
packages = ["data_upload"]
